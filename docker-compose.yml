services:
  forward_service:
    build:
      context: .
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: um790_forward_paper_test
    restart: unless-stopped
    environment:
      # タイムゾーン設定（スケジューラーが正確に 08:00 JST に実行される）
      TZ: Asia/Tokyo
      # GDrive 同期先（オプション）
      # 設定例: GDRIVE_REMOTE=gdrive:Claude/UKI論文改良bot
      GDRIVE_REMOTE: ${GDRIVE_REMOTE:-}
    volumes:
      # ローカルのディレクトリをマウント（コンテナ終了後もデータ保持）
      - ./logs:/app/logs
      - ./state:/app/state
      - ./results:/app/results
      - ./exports:/app/exports
      # rclone 設定ディレクトリ（GDrive認証情報）
      # 読み書き可能でマウント: OAuth アクセストークンの自動リフレッシュを保存するため
      # （:ro だとトークン期限切れ後に同期が失敗する）
      - ~/.config/rclone:/root/.config/rclone
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # ホスト側から コンテナログ確認
    # docker logs -f um790_forward_paper_test
